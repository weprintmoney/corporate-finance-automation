# Ledger schema for /value-company
#
# inputs.yaml holds every input number for one company's valuation. Computed results never go
# here; they go to model-output.md. Each input leaf is a mapping:
#
#   value: <number or string>
#   source: <file in sources/ plus the note or section, or the document name if not compiled>
#   as_of: YYYY-MM-DD
#   note: <optional, one line>
#   estimate: true          # optional; private-company bounding figures
#   range: [low, high]      # optional; required when estimate is true
#
# No other keys are allowed in a leaf; the validator rejects them. Quote any string that contains
# a comma or a colon, or YAML will split it.
#
# Lists of years (company.history, forecast.years) use plain scalars inside each row and one
# source/as_of per row.
#
# Units: currency amounts in millions of meta.currency unless the field says otherwise. Rates and
# ratios as decimals (0.0477, not 4.77%). Shares in millions.
#
# "required_for" lists the company types that must supply the field. "used_by" lists lessons.

meta:
  company:            {type: string, required_for: [all], description: "Legal name"}
  slug:               {type: string, required_for: [all], description: "kebab-case folder name"}
  ticker:             {type: string, required_for: [public, delisted, foreign-public], description: "Exchange ticker, or null"}
  type:               {type: enum, values: [public, delisted, private, foreign-public], required_for: [all]}
  home_country:       {type: string, required_for: [all]}
  currency:           {type: string, required_for: [all], description: "Analysis currency (ISO code)"}
  reporting_currency: {type: string, required_for: [all]}
  accounting_basis:   {type: string, required_for: [foreign-public], description: "US GAAP, IFRS, or local"}
  fiscal_year_end:    {type: string, required_for: [all], description: "e.g. 12-31"}
  base_year:          {type: integer, required_for: [all], description: "Latest full fiscal year used as the base"}
  analysis_date:      {type: date, required_for: [all], description: "The date the valuation is as of. Every market input must be from within its window of this date. For a delisted company, the last unaffected trading day before the deal, so the value can be compared with the deal price on the same rates"}
  price_basis:        {type: string, required_for: [delisted], description: "last-unaffected or deal: which one company.share_price is"}
  analyst:            {type: string, required_for: [all]}
  omitted:            {type: list, required_for: [], description: "Fields left out, each with a one-line reason"}

modeling_choices:
  coverage_numerator:  {type: enum, values: [ebit, ebit_plus_acquisition_amortization, ebitda], default: ebit, used_by: [12, 18, 19], description: "Numerator for interest coverage in the synthetic rating and the optimal-debt loop; the model also reports the other two"}
  firm_size_table:     {type: enum, values: [large, small], default: small, used_by: [12, 18], description: "Damodaran's ratings table; large for market cap above about $5B"}
  sbc_treatment:       {type: enum, values: [expense, addback], default: expense, used_by: [14, 30, 34], description: "Stock-based compensation charged as an expense (course default) or added back"}
  firm_value_basis:    {type: enum, values: [market, deal], default: market, used_by: [18, 19], description: "Debt plus equity at market, or the deal enterprise value for a delisted company"}
  beta_source:         {type: enum, values: [bottom_up, regression, total], default: bottom_up, used_by: [8, 10, 11, 13]}
  kd_source:           {type: enum, values: [observed, synthetic, actual_rating], default: observed, used_by: [12, 13], description: "Which pre-tax cost of debt the cost of capital uses"}
  terminal_method:     {type: enum, values: [consistent_reinvestment, fcff_growth], default: consistent_reinvestment, used_by: [32, 34], description: "Terminal value from after-tax EBIT with reinvestment = g / stable ROIC (lesson 32), or final-year FCFF grown at g; the model prints both"}

market:
  govt_bond_rate:      {type: rate, required_for: [all], used_by: [5, 12, 18], description: "10-year government bond yield in meta.currency on the analysis date. Base for the cost of debt: rating default spreads are measured over it"}
  sovereign_default_spread: {type: rate, required_for: [all], used_by: [5], description: "Default spread for the government's rating (US: Aa1 since Moody's May 2025 downgrade). 0 only for a Aaa government, with the rating cited"}
  risk_free_rate:      {type: rate, required_for: [all], used_by: [5, 13, 32], description: "govt_bond_rate − sovereign_default_spread. Base for the cost of equity; the validator checks the identity"}
  mature_erp:          {type: rate, required_for: [all], used_by: [6, 13], description: "Implied equity risk premium measured over risk_free_rate (Damodaran's 'with default spread' figure, not the one over the Treasury)"}
  ratings_table:       {type: string, required_for: [all], used_by: [12, 18], description: "Path, relative to inputs.yaml, of the ratings-spreads.json snapshot this valuation uses (sources/market-data/ratings-spreads-<as_of>.json); as_of is the table's own date"}
  tax_rate_marginal:   {type: rate, required_for: [all], used_by: [9, 12, 13, 17, 18, 21], description: "Statutory marginal rate in the home country"}
  tax_rate_effective:  {type: rate, required_for: [], used_by: [30], description: "Base-year effective rate, if used for base-year cash flow"}
  terminal_growth:     {type: rate, required_for: [all], used_by: [15, 19, 32, 34], description: "Perpetual growth rate; must not exceed risk_free_rate"}

country:
  exposures:           {type: list, required_for: [all], used_by: [7, 16], description: "Rows of {country, weight, erp, measure}; weights sum to 1; measure is revenues, production, or assets"}
  weighted_erp:        {type: rate, required_for: [all], used_by: [7, 13], description: "Sum of weight × erp; the model recomputes and checks it"}

beta:
  regression_beta:     {type: number, required_for: [], used_by: [4, 8], description: "Against the home index, with window and interval in note"}
  regression_se:       {type: number, required_for: [], used_by: [8]}
  regression_r2:       {type: number, required_for: [], used_by: [8, 11]}
  jensens_alpha:       {type: rate, required_for: [], used_by: [8, 22, 27]}
  unlevered_bottom_up: {type: number, required_for: [all], used_by: [10, 11, 13, 18], description: "Industry unlevered beta, cash-corrected, or the weighted segment beta"}
  segments:            {type: list, required_for: [], used_by: [10, 13], description: "Rows of {name, weight, industry, unlevered_beta}; weights sum to 1"}
  total_beta:          {type: number, required_for: [private], used_by: [11], description: "Market beta divided by the square root of R-squared"}

company:
  shares_basic:        {type: number, required_for: [public, delisted, foreign-public], used_by: [4, 13, 33], description: "Cover-page basic shares outstanding, millions"}
  shares_diluted:      {type: number, required_for: [public, delisted, foreign-public], used_by: [33], description: "From the EPS note"}
  share_price:         {type: number, required_for: [public, delisted, foreign-public], used_by: [13, 29, 35], description: "Closing price on meta.analysis_date; for a delisted company, the last unaffected close before the deal was announced or leaked"}
  deal_price:          {type: number, required_for: [delisted], used_by: [29, 33, 36], description: "Per-share price paid in the going-private or acquisition deal"}
  equity_value:        {type: number, required_for: [all], used_by: [9, 13, 18, 29, 35], description: "shares_basic × share_price for listed companies; last round or estimate for private"}
  equity_book:         {type: number, required_for: [], used_by: [13, 35], description: "Book value of equity"}
  debt_face:           {type: number, required_for: [all], used_by: [12, 13], description: "Interest-bearing debt at face value"}
  debt_book:           {type: number, required_for: [], used_by: [12, 13], description: "Carrying value, if different from face"}
  debt_market:         {type: number, required_for: [], used_by: [12, 13], description: "Fixed-rate debt priced as a bond at today's pre-tax cost of debt (coupon = interest, maturity = debt.maturity_years); floating-rate debt at face. Use when rates moved since issuance"}
  lease_debt:          {type: number, required_for: [all], used_by: [12, 13], description: "Present value of lease liabilities from the lease note"}
  off_balance_sheet_debt: {type: number, required_for: [], used_by: [12, 13], description: "Fixed commitments that pass the debt test but are not on the balance sheet: leases signed but not yet commenced, guarantees of joint-venture or special-purpose-vehicle debt, take-or-pay capacity contracts. Note says what is included"}
  debt_total:          {type: number, required_for: [all], used_by: [12, 13, 18, 19, 22, 33], description: "debt_face, debt_book or debt_market (say which) + lease_debt + off_balance_sheet_debt"}
  deferred_revenue:    {type: number, required_for: [], used_by: [12], description: "Recorded so the walkthrough can say it is not debt"}
  cash:                {type: number, required_for: [all], used_by: [26, 33]}
  minority_interests:  {type: number, required_for: [], used_by: [33]}
  cross_holdings:      {type: number, required_for: [], used_by: [33], description: "Market or estimated value of minority holdings in other companies"}
  options_value:       {type: number, required_for: [], used_by: [33], description: "Value of outstanding options and RSUs as a claim; note the method"}
  revenue:             {type: number, required_for: [all], used_by: [1, 29, 31, 35]}
  ebit:                {type: number, required_for: [all], used_by: [12, 14, 18, 20, 30], description: "Operating income as reported, SBC expensed"}
  ebitda_standardized: {type: number, required_for: [], used_by: [18], description: "EBIT + D&A, no SBC or one-off add-backs"}
  ebitda_adjusted:     {type: number, required_for: [], used_by: [18], description: "The company's own adjusted EBITDA, labeled as such"}
  acquisition_amortization: {type: number, required_for: [], used_by: [14, 18], description: "Amortization of acquired intangibles inside D&A"}
  interest_expense:    {type: number, required_for: [all], used_by: [12, 18, 19], description: "Gross interest expense"}
  interest_capitalized: {type: number, required_for: [], used_by: [12, 18], description: "Interest capitalized into construction in progress (debt note or cash-flow statement); added to interest_expense for coverage"}
  depreciation_life_change: {type: string, required_for: [], used_by: [12, 14, 30], description: "Any change in useful lives of servers, equipment or plant in the last three years, with the earnings effect the company disclosed"}
  net_income:          {type: number, required_for: [all], used_by: [26, 29, 31]}
  da:                  {type: number, required_for: [all], used_by: [14, 26, 30], description: "Depreciation and amortization"}
  capex:               {type: number, required_for: [all], used_by: [14, 26, 30, 32]}
  change_wc:           {type: number, required_for: [all], used_by: [14, 26, 30], description: "Increase in non-cash working capital (positive = cash used)"}
  rd_expense:          {type: number, required_for: [], used_by: [1, 14, 31]}
  sbc:                 {type: number, required_for: [], used_by: [14, 18, 30, 34], description: "Stock-based compensation expense"}
  invested_capital:    {type: number, required_for: [all], used_by: [14, 31], description: "Book equity + book debt − cash, or operating assets basis; say which"}
  goodwill:            {type: number, required_for: [], used_by: [14, 31]}
  history:             {type: list, required_for: [all], used_by: [1, 24, 26, 27, 29, 31], description: "One row per fiscal year, five if available: revenue, ebit, net_income, da, capex, change_wc, dividends, buybacks, debt_issued, debt_repaid, cash, debt_total, invested_capital, share_price_year_end; one source and as_of per row; optional impairment (non-cash impairments inside operating income and net income, from the cash flow statement), added back for FCFE, ROIC and FCFF"}

debt:
  rating_actual:       {type: string, required_for: [all], used_by: [12, 18], description: "Agency rating with the action cited, or null with a note that filings disclose none"}
  kd_pretax_observed:  {type: rate, required_for: [], used_by: [12, 13], description: "Rate on the company's own debt at the base-year end"}
  rate_type:           {type: enum, values: [fixed, floating, mixed], required_for: [all], used_by: [23]}
  currency:            {type: string, required_for: [all], used_by: [5, 23]}
  maturity_years:      {type: number, required_for: [], used_by: [23], description: "Weighted average remaining maturity"}
  revolver_undrawn:    {type: number, required_for: [], used_by: [12, 22]}
  bankruptcy_cost:     {type: rate, required_for: [], used_by: [21], description: "Direct plus indirect cost of bankruptcy as a share of firm value (lesson 21: direct 5-10%, indirect higher where customers or suppliers flee a distressed firm). Turns on the model's adjusted-present-value section"}
  covenants:           {type: string, required_for: [], used_by: [2, 17, 19, 25], description: "One paragraph: maintenance covenants, restricted payments, change of control"}

governance:
  board:               {type: list, required_for: [public, delisted, foreign-public], used_by: [2], description: "Rows of {name, role, independent, affiliated_with}"}
  controlling_holders: {type: list, required_for: [all], used_by: [2, 4, 22, 25, 36], description: "Rows of {name, pct, source, as_of}; each holder separate"}
  share_classes:       {type: string, required_for: [all], used_by: [4]}
  marginal_investor:   {type: string, required_for: [all], used_by: [4, 11, 25], description: "Who sets the price, and whether diversified"}
  objectives:          {type: string, required_for: [all], used_by: [3], description: "Stated goals, quoted, with where they were stated"}
  change_of_control_payouts: {type: string, required_for: [], used_by: [2]}

forecast:
  years:               {type: list, required_for: [all], used_by: [31, 32, 34], description: "Rows of {year, revenue, ebit_margin, reinvestment, fcff}; fcff may be given directly or derived"}
  growth_period_years: {type: integer, required_for: [all], used_by: [32]}
  stable_roic:         {type: rate, required_for: [all], used_by: [32, 34], description: "Return on capital in the terminal period; terminal reinvestment = terminal_growth / stable_roic"}
  sales_to_capital:    {type: number, required_for: [], used_by: [31], description: "Incremental revenue per dollar of reinvestment"}
  management_growth:   {type: rate, required_for: [], used_by: [31], description: "Management's stated growth, with where it was stated"}
  analyst_growth:      {type: rate, required_for: [], used_by: [31]}
  wacc_stable:         {type: rate, required_for: [], used_by: [32, 34], description: "Cost of capital in the terminal period if different from the current one"}

peers:
  _row:                {type: list, required_for: [all], used_by: [9, 11, 21, 28, 35], description: "Rows of {name, ticker, fiscal_period, enterprise_value, revenue, ebitda, net_income, equity_book, market_cap, growth, ebit_margin, beta, debt_ratio, payout, source, as_of}"}

facts:
  _row:                {type: list, required_for: [], used_by: [all], description: "Rows of {id, value, source, as_of, note} for numbers a lesson answer or the walkthrough quotes that no other field holds: counts, dates, percentages and amounts read from filings (customers affected, headcount, premiums paid). id is kebab-case. Keeps rule 1 (ledger first) true for context numbers, not only model inputs"}
