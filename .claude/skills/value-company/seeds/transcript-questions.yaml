- id: l35-p2
  lesson: 35
  part: 2
  title: "Backing Out What Drives a Multiple: Why Cheap Stocks Usually Deserve to Be Cheap"
  transcript: 03-corporate-finance/03-2-course-content/04-dividends-and-valuation/lesson-35/session-35-part-2.md
  quote: Most companies that look cheap deserve to be cheap.
  concept: Multiples are driven by growth, risk and cash-flow quality; a low multiple is usually explained by weak fundamentals, not mispricing.
  question: >-
    If {company} looks cheap or expensive against its peers, is that explained by its growth, risk
    and margins (a regression of the multiple on those drivers), or is there a mispricing left over?
  inputs: [peers, company.history]
  applies_to: [all]

- id: l36-p1
