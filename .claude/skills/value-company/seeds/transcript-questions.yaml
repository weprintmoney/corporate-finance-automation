- id: l36-p2
  lesson: 36
  part: 2
  title: "The Trade-Off on Debt and the Three First Principles of Corporate Finance"
  transcript: 03-corporate-finance/03-2-course-content/04-dividends-and-valuation/lesson-36/session-36-part-2.md
  quote: If you cannot find investments that make your hurdle rate, find a way to get the cash back to your stockholders.
  concept: Investment, financing and dividend decisions are one system - invest when returns beat the hurdle rate, finance to minimize it, and return what cannot be invested well.
