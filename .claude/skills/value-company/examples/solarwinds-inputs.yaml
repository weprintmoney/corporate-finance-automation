# Example ledger: SolarWinds (SWI), FY2024 base year, delisted April 2025.
#
# THIS IS A TOOL-TEST FIXTURE, NOT A REFERENCE VALUATION. It exists so tools/model.py,
# tools/validate-ledger.py and tools/check-walkthrough.py can be exercised in CI.
#
# Two kinds of values are in here, and the `source` field tells them apart:
#   - Real figures, cited to the SolarWinds project files in this repo that carry them
#     (company-valuations/solarwinds/capital-iq-rerun.md, tools/capital-structure-rerun.py,
#     lesson-12.md, lesson-18.md, lesson-31.md, README.md, valuation-report.md). Those files cite
#     the underlying filings. Nothing here was read directly from a filing.
#   - `source: placeholder` values, which are made up so the model has something to compute on.
#     They are NOT SolarWinds data. The validator warns on each one and rejects them in any
#     ledger outside this examples/ folder.
#
# The company figures are the "C: recommended" track of capital-iq-rerun.md. The market block was
# moved to the skill's 2026-10 conventions (risk-free rate net of the US Aa1 spread, ERP measured
# over it, January 2026 ratings table, cost of debt built on the Treasury rate), so tools/model.py no
# longer reproduces that file's results (WACC 10.10%, optimal debt 17% / 21%, DCF $18.94). The
# SolarWinds project predates the skill and is due a rerun under /value-company.
#
# Strings with commas are quoted.

meta:
  company: SolarWinds Corporation
  slug: solarwinds
  ticker: SWI
  type: delisted
  home_country: United States
  currency: USD
  reporting_currency: USD
  fiscal_year_end: "12-31"
  base_year: 2024
  analysis_date: "2026-10-06"
  price_basis: last-unaffected
  analyst: weprintmoney
  omitted:
    - field: beta.regression_beta
      reason: "Price history did not load from Capital IQ and free sources drop delisted tickers (capital-iq-rerun.md); bottom-up beta used instead."

modeling_choices:
  coverage_numerator: ebit
  firm_size_table: small
  sbc_treatment: expense
  firm_value_basis: market
  beta_source: bottom_up
  kd_source: observed
  terminal_method: fcff_growth   # the rerun grew final-year FCFF at g; the course default is consistent_reinvestment

market:
  govt_bond_rate: {value: 0.0529, source: "03-corporate-finance/03-3-supplemental-data/market-rates.json damodaran_monthly.treasury_10y (ERPOct26.xlsx)", as_of: "2026-10-01", note: "10-year US Treasury"}
  sovereign_default_spread: {value: 0.0022, source: "03-corporate-finance/03-3-supplemental-data/market-rates.json damodaran_monthly.us_sovereign_default_spread (ERPOct26.xlsx)", as_of: "2026-10-01", note: "Moody's Aa1"}
  risk_free_rate: {value: 0.0507, source: "03-corporate-finance/03-3-supplemental-data/market-rates.json damodaran_monthly.dollar_riskfree_rate (ERPOct26.xlsx)", as_of: "2026-10-01", note: "Treasury rate net of the Aa1 default spread"}
  mature_erp: {value: 0.0392, source: "03-corporate-finance/03-3-supplemental-data/market-rates.json damodaran_monthly.implied_erp_over_dollar_riskfree (ERPOct26.xlsx)", as_of: "2026-10-01", note: "implied ERP over the dollar risk-free rate, rounded"}
  ratings_table: {value: ratings-spreads-2026-01-01.json, source: "03-corporate-finance/03-3-supplemental-data/ratings-spreads.json (Damodaran ratings.xls)", as_of: "2026-01-01"}
  tax_rate_marginal: {value: 0.25, source: "company-valuations/solarwinds/tools/capital-structure-rerun.py (T)", as_of: "2026-10-06"}
  terminal_growth: {value: 0.025, source: "company-valuations/solarwinds/tools/capital-structure-rerun.py (G); below the risk-free rate", as_of: "2026-10-06"}

country:
