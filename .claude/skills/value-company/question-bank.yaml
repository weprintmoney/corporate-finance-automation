  - What synthetic rating does interest coverage imply, and what cost of debt?
  - If the two differ, why?
  - What is the market value of interest-bearing debt? If the debt is fixed-rate and rates have moved since it was
    issued, how far is market value from book?
  - What is the debt value of lease commitments, including leases signed but not yet started?
  - Does the company guarantee debt of joint ventures or special-purpose vehicles, or have take-or-pay capacity
    contracts, that pass the debt test but sit off the balance sheet?
  - How much interest was capitalized into construction, and what does coverage look like once it is added back?
  - Did the company lengthen the depreciation lives of servers or equipment, and how much did that raise operating
    income?
  - What marginal tax rate applies to the after-tax cost of debt?
