  transcript: 03-corporate-finance/03-2-course-content/01-foundations-and-discount-rates/lesson-11/session-11-part-2.md
  quote: You cannot use a market beta to come up with the cost of equity because that market beta focuses only on
    the risk you cannot diversify away.
  concept: An undiversified owner bears all the risk, so the right beta is total beta = market beta ÷ √R².
  question: Is {company}'s owner or marginal investor diversified? If not, what is the total beta (market beta divided
    by the square root of R-squared) and the resulting cost of equity, and when during {company}'s ownership history
    would total beta have been the right measure?
