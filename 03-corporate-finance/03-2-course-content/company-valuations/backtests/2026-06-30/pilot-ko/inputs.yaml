  slug: coca-cola
  ticker: KO
  type: public
  home_country: United States
  currency: USD
  reporting_currency: USD
  fiscal_year_end: 12-31
  base_year: 2025
  analysis_date: '2026-06-30'
  analyst: weprintmoney
  mode: quick
  blind: true
  omitted:
  - field: beta.regression_beta
    reason: no price-history source permitted in the blind run; bottom-up beta used
  - field: company.rd_history
    reason: Coca-Cola does not report R&D separately
  - field: company.history 2021-2022
    reason: fetch-filings.py fetched two 10-Ks; 2022 balance sheet (debt, cash, invested capital) is not in them, so history runs 2023-2025
  - field: company.acquisition_amortization
    reason: amortization of acquired intangibles is not separately disclosed and is small (most intangibles are indefinite-lived trademarks)
  - field: forecast.analyst_growth
    reason: no analyst consensus source permitted in the blind run
