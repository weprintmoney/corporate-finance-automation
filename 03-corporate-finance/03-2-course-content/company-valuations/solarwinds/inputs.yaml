# Ledger: SolarWinds Corporation (SWI), FY2024 base year, valued as of 2025-02-05.
#
# 2025-02-05 is the last undisturbed trading day before the Turn/River merger was announced on
# 2025-02-07. Every market input is from that date, so the value can be set against both the $15.18
# unaffected price and the $18.50 deal price on the rates that held when the deal was struck.
#
# Paths in `source` are relative to this folder. Amounts in $ millions; rates as decimals.

meta:
  company: SolarWinds Corporation
  slug: solarwinds
  ticker: SWI
  type: delisted
  home_country: United States
  currency: USD
  reporting_currency: USD
  fiscal_year_end: "12-31"
  base_year: 2024
  analysis_date: "2025-02-05"
  price_basis: last-unaffected
  analyst: weprintmoney
  omitted:
    - field: beta.regression_beta
      reason: "SWI was delisted in April 2025; free price sources (Yahoo, Nasdaq, Stooq) no longer serve its history, and Capital IQ's price module did not load (sources/capital-iq/README.md). The bottom-up beta is the course's preferred estimate anyway."
    - field: beta.regression_se
      reason: "No regression; see beta.regression_beta."
    - field: beta.regression_r2
      reason: "No regression; see beta.regression_beta."
    - field: beta.jensens_alpha
      reason: "No price history; see beta.regression_beta."
    - field: beta.segments
      reason: "SolarWinds reports one operating segment (sources/filings/swi-10k-fy2024.md note 16), so there are no segment weights to compute a weighted beta from."
    - field: beta.total_beta
      reason: "Total beta needs the correlation with the market from a regression; there is no price history (see beta.regression_beta). Lesson 11 shows an illustration from the industry correlation instead."
    - field: forecast.analyst_growth
      reason: "Consensus estimates did not load from Capital IQ (sources/capital-iq/README.md); management's forecast in the merger document is used instead."
    - field: company.debt_market
      reason: "The only borrowing is a floating-rate term loan that resets to SOFR plus 2.75%, so its market value is its face value."

modeling_choices:
  coverage_numerator: ebit
  firm_size_table: small        # market cap $2.6 billion, under Damodaran's $5 billion line
  sbc_treatment: expense
  firm_value_basis: market
  beta_source: bottom_up
  kd_source: observed
  terminal_method: consistent_reinvestment

market:
  govt_bond_rate: {value: 0.0443, source: "sources/market-data/market-rates-2025-02-05.json fred_latest.treasury_10y (FRED DGS10)", as_of: "2025-02-05", note: "10-year US Treasury close; Damodaran's start-of-month figure was 0.0454"}
  sovereign_default_spread: {value: 0.0, source: "sources/market-data/country-risk-2025-01-01.json countries.United States (Moody's Aaa, default spread 0)", as_of: "2025-01-01", note: "The US was rated Aaa until Moody's downgrade on 2025-05-16"}
  risk_free_rate: {value: 0.0443, source: "govt_bond_rate − sovereign_default_spread", as_of: "2025-02-05"}
  mature_erp: {value: 0.0427, source: "sources/market-data/market-rates-2025-02-05.json damodaran_monthly.implied_erp_over_dollar_riskfree (ERPFeb25.xlsx)", as_of: "2025-02-01", note: "Implied premium on the S&P 500 at 6040.53, measured over the 0.0454 start-of-month Treasury; with a zero US spread it is the same over the Treasury. Paired with the 0.0443 close on the analysis date: the 0.11-point gap is inside the skill's 0.25-point tolerance and moves the cost of equity by under 0.1 point"}
  ratings_table: {value: sources/market-data/ratings-spreads-2025-01-01.json, source: "Damodaran ratings24.xls (January 2025 edition), via scripts/refresh-market-data.py --as-of", as_of: "2025-01-01"}
  tax_rate_marginal: {value: 0.25, source: "sources/market-data/country-risk-regions-2025-01-01.md, Country Tax Rates sheet (United States 25%: federal 21% plus state); same figure as <CC>/01-foundations-and-discount-rates/lesson-12/spreadsheet-countrytaxrates24.md", as_of: "2025-01-01"}
  terminal_growth: {value: 0.025, source: "Judgment: midpoint of Goldman Sachs' 2%–3% perpetuity range and the low end of Jefferies' 2.5%–3.5% (sources/deal-docs/swi-defm14c-2025-merger.md, fairness opinions); below the 0.0443 risk-free rate", as_of: "2025-02-05"}

country:
  exposures:
    - {country: United States, weight: 0.6482, erp: 0.0427, measure: revenues, source: "sources/filings/swi-10k-fy2024.md note 16 (United States revenue 516.559 of 796.895); ERP = market.mature_erp", as_of: "2024-12-31"}
    - {country: International, weight: 0.3518, erp: 0.0611, measure: revenues, source: "sources/filings/swi-10k-fy2024.md note 16 (international revenue 280.336); ERP = mature_erp 0.0427 + EMEA country risk premium 0.0184 (sources/market-data/country-risk-regions-2025-01-01.md: EMEA ERP 0.0617 less the workbook's mature ERP 0.0433)", as_of: "2024-12-31", note: "Judgment: the 10-K gives no regional split. EMEA stands in for all international revenue because most international offices are in Europe; Western Europe alone would be 0.0112 and the global average 0.0143"}
  weighted_erp: {value: 0.0492, source: "computed from exposures above", as_of: "2025-02-05"}

beta:
  unlevered_bottom_up: {value: 1.22, source: "sources/market-data/industry-betas-2025-01-05.json industries.Software (System & Application).unlevered_beta_cash_corrected (333 firms)", as_of: "2025-01-05"}

