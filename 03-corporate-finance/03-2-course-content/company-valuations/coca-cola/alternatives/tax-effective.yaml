# Ledger for The Coca-Cola Company (KO), quick mode, blind backtest as of 2026-06-30.
# Every input leaf is {value, source, as_of}. Amounts in USD millions; rates as decimals; shares in millions.
# K25 = sources/filings/ko-10-k-2026-02-20.md (FY2025 10-K, filed 2026-02-20)
# K24 = sources/filings/ko-10-k-2025-02-20.md (FY2024 10-K, filed 2025-02-20)
# Q1  = sources/filings/ko-10-q-2026-04-30.md (Q1 2026 10-Q, filed 2026-04-30)

meta:
  company: The Coca-Cola Company
  slug: coca-cola
  ticker: KO
  type: public
  home_country: United States
  currency: USD
  reporting_currency: USD
  fiscal_year_end: "12-31"
  base_year: 2025
  analysis_date: 2026-06-30
  analyst: weprintmoney
  mode: quick
  blind: true
  omitted:
    - "beta.regression_beta: no price-history source is allowed in the blind run; the bottom-up beta is used"
    - "beta.regression_se / regression_r2 / jensens_alpha: same reason"
    - "forecast.analyst_growth: no analyst consensus source is allowed in the blind run"
    - "company.history[2022] debt_total and invested_capital: the 2022 balance sheet is not in either fetched 10-K"
    - "company.rd_history: Coca-Cola does not report R&D as a separate line"

modeling_choices:
  coverage_numerator: ebit
  rd_amortizable_life: null
  firm_size_table: large
  sbc_treatment: expense
  firm_value_basis: market
  beta_source: bottom_up
  kd_source: actual_rating
  terminal_method: consistent_reinvestment

market:
