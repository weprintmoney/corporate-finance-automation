  risk_free_rate: {value: 0.0418, source: "govt_bond_rate − sovereign_default_spread; sources/market-data/rates-2026-06-30.md", as_of: 2026-06-30}
  mature_erp: {value: 0.045705, source: "sources/market-data/market-rates-2026-06-01.json damodaran_monthly.implied_erp_over_dollar_riskfree", as_of: 2026-06-01}
  ratings_table: {value: ../sources/market-data/ratings-spreads-2026-01-01.json, source: "Damodaran ratings.xls January 2026 via scripts/refresh-market-data.py --as-of 2026-06-30", as_of: 2026-01-01}
  tax_rate_marginal: {value: 0.1788, source: "03-2-course-content/01-foundations-and-discount-rates/lesson-12/spreadsheet-countrytaxrates24.md, United States row (federal 21% plus state); statutory rate unchanged through 2026-06-30", as_of: 2025-12-31}
  tax_rate_effective: {value: 0.1788, source: "K25 consolidated statement of income: income taxes 2861 ÷ income before income taxes 15998", as_of: 2025-12-31}
  terminal_growth: {value: 0.03, source: "Analyst choice below the 4.18% risk-free rate; long-run nominal growth for a global consumer staple (see read.md Discretionary decisions)", as_of: 2026-06-30}

