meta:
  company: Colgate-Palmolive Company
  slug: colgate-palmolive
  ticker: CL
  type: public
  home_country: United States
  currency: USD
  reporting_currency: USD
  fiscal_year_end: "12-31"
  base_year: 2025
  analysis_date: "2026-11-20"
  analyst: weprintmoney
  omitted:
    - field: beta.total_beta
      reason: "Total beta is for undiversified owners. Colgate's price is set by diversified institutions (87% institutional, sources/capital-iq/public-ownership.tsv), so the market beta applies."
    - field: debt.maturity_years
      reason: "The 10-K gives maturities by year only to 2030 and a single figure after that (note 6). The weighted maturity will be built from the bond list in sources/capital-iq/credit-ratings.tsv in lesson 23."
    - field: peers
      reason: "The peer set is not yet agreed. Candidates are in sources/capital-iq/quick-comps.tsv; fetch-peer-facts.py runs once the set is fixed (lesson 35)."

modeling_choices:
  coverage_numerator: ebit
  firm_size_table: large        # market cap $78.5 billion, above Damodaran's $5 billion line
  sbc_treatment: expense
  firm_value_basis: market
  beta_source: bottom_up
  kd_source: actual_rating      # Colgate has an agency rating (S&P A+), which the course uses ahead of a synthetic one
  terminal_method: consistent_reinvestment

market:
  govt_bond_rate: {value: 0.0504, source: "sources/market-data/market-rates-2026-11-19.json fred_latest.treasury_10y (FRED DGS10)", as_of: "2026-11-19", note: "10-year US Treasury close; Damodaran's start-of-November figure was 0.0494"}
  sovereign_default_spread: {value: 0.0022, source: "sources/market-data/market-rates-2026-11-19.json damodaran_monthly.us_sovereign_default_spread (US rated Aa1 by Moody's)", as_of: "2026-11-01"}
  risk_free_rate: {value: 0.0482, source: "govt_bond_rate − sovereign_default_spread", as_of: "2026-11-19"}
  mature_erp: {value: 0.0361, source: "sources/market-data/market-rates-2026-11-19.json damodaran_monthly.implied_erp_over_dollar_riskfree (ERPNov26.xlsx)", as_of: "2026-11-01", note: "Implied premium with the S&P 500 at 7580.07. The index closed at 6910.39 on 2026-11-20 (sources/market-data/cl-vs-sp500-monthly-2020-12-to-2026-11.tsv), 8.8% lower, so the premium on the analysis date is higher than this start-of-month figure"}
  ratings_table: {value: sources/market-data/ratings-spreads-2026-01-01.json, source: "Damodaran ratings.xls (January 2026 edition), via scripts/refresh-market-data.py", as_of: "2026-01-01"}
  tax_rate_marginal: {value: 0.25, source: "professor-spreadsheet/originals/fcffsimpleginzu.xlsx, Country equity risk premiums sheet (United States corporate tax rate 25%: federal 21% plus state)", as_of: "2026-01-01"}
  tax_rate_effective: {value: 0.235, source: "sources/filings/cl-10k-fy2025.txt MD&A (26.1% reported for 2025, 23.1% excluding the write-down and other items) and sources/filings/cl-10q-2026-q3.txt (23.8% for the first nine months of 2026)", as_of: "2026-09-30"}
  terminal_growth: {value: 0.03, source: "Judgment: close to consensus revenue growth for 2027 and 2028 (2.33% and 3.46%, sources/capital-iq/key-stats.tsv) and below the 0.0482 risk-free rate. The professor's spreadsheet default is the risk-free rate", as_of: "2026-11-20"}

country:
  exposures:
    - {country: United States, weight: 0.3333, erp: 0.0361, measure: revenues, source: "sources/filings/cl-10k-fy2025.txt note 14 (approximately two-thirds of Net sales are generated outside the United States); ERP = market.mature_erp", as_of: "2025-12-31"}
    - {country: Emerging markets, weight: 0.45, erp: 0.0705, measure: revenues, source: "sources/filings/cl-10k-fy2025.txt note 14 (approximately 45% of Net sales from emerging markets: Latin America, Asia excluding Japan, Africa/Eurasia, Central Europe); ERP = mature_erp 0.0361 + country risk premium 0.0344, the regional premiums in sources/market-data/country-risk-regions-2026-01-01.md weighted by 2025 segment sales (Latin America 4,776 at 4.39%, Asia Pacific 2,814 at 1.49%, Africa/Eurasia 1,172 at 4.26%)", as_of: "2025-12-31"}
    - {country: Other developed markets, weight: 0.2167, erp: 0.0465, measure: revenues, source: "Remainder of Net sales (1 − 0.3333 − 0.45); ERP = mature_erp 0.0361 + Western Europe country risk premium 0.0104 (sources/market-data/country-risk-regions-2026-01-01.md)", as_of: "2025-12-31"}
  weighted_erp: {value: 0.0538, source: "computed from exposures above", as_of: "2026-11-20"}

beta:
  regression_beta: {value: 0.315, source: "sources/market-data/cl-vs-sp500-monthly-2020-12-to-2026-11.tsv: 60 monthly returns, October 2021 to October 2026, CL dividend-adjusted close against the S&P 500 total return index", as_of: "2026-10-31", note: "Capital IQ shows a five-year beta of 0.31 (sources/capital-iq/key-stats.tsv page header)"}
  regression_se: {value: 0.158, source: "same regression", as_of: "2026-10-31"}
  regression_r2: {value: 0.064, source: "same regression", as_of: "2026-10-31"}
  jensens_alpha: {value: 0.0039, source: "same regression: intercept per month, before netting the risk-free rate times (1 − beta)", as_of: "2026-10-31"}
  unlevered_bottom_up: {value: 0.6796, source: "weighted segment beta from beta.segments", as_of: "2026-01-05"}
  segments:
    - {name: "Oral, Personal and Home Care", weight: 0.7737, industry: Household Products, unlevered_beta: 0.7411, source: "sources/filings/cl-10k-fy2025.txt MD&A segment sales (20,382 total less Hill's 4,613 = 15,769); sources/market-data/industry-betas-2026-01-05.json Household Products.unlevered_beta_cash_corrected (110 firms)", as_of: "2026-01-05"}
    - {name: Hill's Pet Nutrition, weight: 0.2263, industry: Food Processing, unlevered_beta: 0.4694, source: "sources/filings/cl-10k-fy2025.txt MD&A (Hill's Net sales 4,613); sources/market-data/industry-betas-2026-01-05.json Food Processing.unlevered_beta_cash_corrected (78 firms)", as_of: "2026-01-05"}

