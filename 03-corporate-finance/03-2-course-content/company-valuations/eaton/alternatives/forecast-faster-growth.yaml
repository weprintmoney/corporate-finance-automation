# Alternative to inputs.yaml: growth 12% a year through 2028 fading to 5% by 2035 (closer to order momentum). One choice changed; everything else identical.
meta:
  company: Eaton Corporation plc
  slug: eaton
  ticker: ETN
  type: public
  home_country: Ireland
  currency: USD
  reporting_currency: USD
  fiscal_year_end: 12-31
  base_year: 2025
  analysis_date: '2026-06-30'
  analyst: weprintmoney
  mode: quick
  blind: true
  omitted:
  - field: beta.regression_beta
    reason: No price series is available to a blind run from the permitted tools; the bottom-up beta is the course default anyway
  - field: company.rd_history
    reason: R&D is 2.9% of revenue and expensed; not capitalized in quick mode (see ⚠️ block)
  - field: debt.bankruptcy_cost
    reason: APV section not turned on; an A-rated firm 12% levered is far from distress
modeling_choices:
  coverage_numerator: ebit
  rd_amortizable_life: null
  firm_size_table: large
  sbc_treatment: expense
  firm_value_basis: market
  beta_source: bottom_up
  kd_source: actual_rating
  terminal_method: consistent_reinvestment
