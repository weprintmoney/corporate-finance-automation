# Alternative: beta.unlevered_bottom_up = 0.7610 (one field changed from ../inputs.yaml; ratings_table path made relative to this folder)
# JPMorgan Chase & Co. — /value-company ledger, quick mode, blind, as of 2026-06-30.
# A bank. Following the course (lesson 11 slides: "We do not unlever or relever betas, because estimating
# debt and equity for banks is an exercise in futility"; lesson 26: FCFE for a bank = net income − increase
# in regulatory capital), the firm is valued as its equity. Deposits and borrowings are raw material, not
# financing, so company.debt_total is set to 0 and model.py's cost of capital equals the cost of equity.
# Sections 2, 3 and 4 of model-output.md (synthetic rating, optimal debt ratio, stress test) do not apply
# and are not used; meta.omitted says why. Bank-specific numbers (regulatory capital, bank FCFE,
# price-to-book against ROE) are computed by bank-equity.py into bank-equity-output.md from this ledger.

meta:
  company: JPMorgan Chase & Co.
  slug: jpmorgan
  ticker: JPM
  type: public
  home_country: United States
  currency: USD
  reporting_currency: USD
  fiscal_year_end: "12-31"
  base_year: 2025
  analysis_date: 2026-06-30
  analyst: weprintmoney
  mode: quick
  blind: true
  omitted:
    - field: company.debt_face
      reason: "Bank: deposits and borrowings are raw material, not financing (lesson 11, lesson 26). Long-term debt is recorded in facts (long-term-debt-2026q1) for the debt-design signal only."
    - field: company.lease_debt
      reason: "Bank: leases are operating costs of the branch network; with debt_total set to 0 they are not a financing claim. Not needed for the cost of equity."
    - field: company.cash
      reason: "Bank: cash and deposits with banks are operating inventory backing deposits, not excess cash to add back. Model defaults it to 0."
    - field: company.da
      reason: "Bank: reinvestment is regulatory capital, not capex net of depreciation (lesson 26 slides)."
    - field: company.capex
      reason: "Bank: as for company.da."
    - field: company.change_wc
      reason: "Bank: working capital is not definable when deposits and loans are the operating balance sheet."
    - field: company.history
      reason: "model.py's section 5 FCFE (capex, D&A, working capital, net debt) does not apply to a bank. The bank FCFE (net income − increase in required CET1 capital) is computed by bank-equity.py from facts rows instead."
    - field: forecast.years
      reason: "The firm DCF does not apply to a bank; value against price is read from price-to-book against ROE − cost of equity (bank-equity-output.md)."
    - field: forecast.growth_period_years
      reason: "As for forecast.years."
    - field: forecast.stable_roic
      reason: "As for forecast.years; the stable ROE used for the justified price-to-book is a discretionary choice in read.md, computed by bank-equity.py."
    - field: model-output.md sections 2-4 (synthetic rating, optimal debt ratio, stress test)
      reason: "Not applicable as built. model.py requires company.ebit and company.interest_expense and always prints these sections; for a bank they price deposits as if they were financing debt. They are printed but never used."
    - field: exhibits
      reason: "make-exhibits.py's cost-of-capital chart draws section 3 (not applicable) and the returns chart needs company.history (omitted). No chart is drawn."

modeling_choices:
  coverage_numerator: ebit
  rd_amortizable_life: null
  firm_size_table: large
  sbc_treatment: expense
  firm_value_basis: market
  beta_source: bottom_up
  kd_source: actual_rating
  terminal_method: consistent_reinvestment

