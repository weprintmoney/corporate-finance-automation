  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7299831d-73ac-4ff6-ae48-8c5bb4292be4\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"a8285148-ff86-457e-9b88-1ac0a2fdb42e\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"53f4525a-9021-453f-b10a-479be125b547\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    body { margin: 0; background: #1A1E2B; }\n    a { color: #89ECEF; }\n    a:hover { color: #35A8B1; }\n    ::selection { background: #35A8B1; color: #1A1E2B; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family: 'Space Grotesk', sans-serif; background: #1A1E2B; color: #E1E5EA; min-height: 100vh;\">\n\n  <!-- HERO -->\n  <div style=\"padding: 64px 60px 40px; max-width: 1280px; margin: 0 auto; border-bottom: 1px solid rgba(255,255,255,0.08);\">\n    <div style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #89ECEF; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 16px;\">Applied Corporate Finance — Module 1 Analysis<\u002Fdiv>\n    <h1 style=\"font-size: 44px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; color: #FFFFFF; margin: 0 0 16px;\">Company Valuation: SolarWinds (SWI)<\u002Fh1>\n    <p style=\"font-size: 18px; line-height: 1.6; color: #E1E5EA; max-width: 820px; margin: 0 0 28px;\">A cost-of-capital walkthrough for SolarWinds Corporation — from board governance and share structure through to a final WACC estimate, using FY2024 10-K data as the valuation base.<\u002Fp>\n    <div style=\"display: flex; gap: 12px; flex-wrap: wrap; padding: 16px 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; max-width: 820px;\">\n      <div style=\"font-size: 14px; line-height: 1.6; color: #8B92A3;\"><strong style=\"color: #E1E5EA;\">Timing note:<\u002Fstrong> SolarWinds (NYSE: SWI) was acquired by Turn/River Capital and taken private in April 2025 for $18.50/share (~$4.4B). This analysis uses FY2024 10-K data as the valuation base; cost-of-capital market rates are current as of August 27, 2026.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 32px;\">\n      <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n        <div style=\"font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; background: linear-gradient(135deg, #89ECEF, #35A8B1); -webkit-background-clip: text; background-clip: text; color: transparent;\">10.33%<\u002Fdiv>\n        <div style=\"font-size: 13px; color: #8B92A3; margin-top: 4px;\">WACC (preferred estimate)<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n        <div style=\"font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; color: #FFFFFF;\">1.55<\u002Fdiv>\n        <div style=\"font-size: 13px; color: #8B92A3; margin-top: 4px;\">Levered beta, bottom-up<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n        <div style=\"font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; color: #FFFFFF;\">4.68%<\u002Fdiv>\n        <div style=\"font-size: 13px; color: #8B92A3; margin-top: 4px;\">Risk-free rate (10Y UST)<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n        <div style=\"font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; color: #FFFFFF;\">$4.4B<\u002Fdiv>\n        <div style=\"font-size: 13px; color: #8B92A3; margin-top: 4px;\">Turn/River acquisition value<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- STICKY NAV -->\n  <div style=\"position: sticky; top: 0; z-index: 10; background: rgba(39,45,62,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 0 60px; overflow-x: auto;\">\n    <div style=\"max-width: 1280px; margin: 0 auto; display: flex; gap: 4px; padding: 12px 0; font-family: 'Space Mono', monospace; font-size: 12px; white-space: nowrap;\">\n      <a href=\"#governance\" style=\"padding: 6px 12px; border-radius: 6px; color: #8B92A3; text-decoration: none;\">02 Governance<\u002Fa>\n      <a href=\"#objectives\" style=\"padding: 6px 12px; border-radius: 6px; color: #8B92A3; text-decoration: none;\">03 Objectives<\u002Fa>\n      <a href=\"#shares\" style=\"padding: 6px 12px; border-radius: 6px; color: #8B92A3; text-decoration: none;\">04 Shares<\u002Fa>\n      <a href=\"#currency\" style=\"padding: 6px 12px; border-radius: 6px; color: #8B92A3; text-decoration: none;\">05 Currency<\u002Fa>\n      <a href=\"#erp\" style=\"padding: 6px 12px; border-radius: 6px; color: #8B92A3; text-decoration: none;\">06 ERP<\u002Fa>\n      <a href=\"#country-risk\" style=\"padding: 6px 12px; border-radius: 6px; color: #8B92A3; text-decoration: none;\">07 Country Risk<\u002Fa>\n      <a href=\"#reg-beta\" style=\"padding: 6px 12px; border-radius: 6px; color: #8B92A3; text-decoration: none;\">08 Reg. Beta<\u002Fa>\n      <a href=\"#beta-fund\" style=\"padding: 6px 12px; border-radius: 6px; color: #8B92A3; text-decoration: none;\">09 Beta Drivers<\u002Fa>\n      <a href=\"#unlevered\" style=\"padding: 6px 12px; border-radius: 6px; color: #8B92A3; text-decoration: none;\">10 Unlevered β<\u002Fa>\n      <a href=\"#levered\" style=\"padding: 6px 12px; border-radius: 6px; color: #8B92A3; text-decoration: none;\">11 Levered β<\u002Fa>\n      <a href=\"#cod\" style=\"padding: 6px 12px; border-radius: 6px; color: #8B92A3; text-decoration: none;\">12 Cost of Debt<\u002Fa>\n      <a href=\"#summary\" style=\"padding: 6px 12px; border-radius: 6px; color: #89ECEF; text-decoration: none;\">Summary<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width: 1280px; margin: 0 auto; padding: 0 60px;\">\n\n    <!-- STEP 2 -->\n    <section id=\"governance\" style=\"padding: 56px 0; border-bottom: 1px solid rgba(255,255,255,0.08);\">\n      <div style=\"display: grid; grid-template-columns: 7fr 5fr; gap: 48px; align-items: start;\">\n        <div>\n          <div style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #35A8B1;\">STEP 02<\u002Fdiv>\n          <h2 style=\"font-size: 30px; font-weight: 600; color: #FFFFFF; margin: 8px 0 20px; letter-spacing: -0.01em;\">Corporate governance<\u002Fh2>\n          <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 16px;\">SolarWinds' board reflected its PE-sponsor-heavy ownership throughout its public life (NYSE: SWI, 2018–2025). Silver Lake Partners and Thoma Bravo — who co-led the 2016 take-private — held board seats and, together, controlled roughly 65% of voting securities at the October 2018 IPO. As Thoma Bravo sold down its stake, Silver Lake's share rose to approximately 75%, making it the dominant shareholder that ultimately drove the 2025 sale.<\u002Fp>\n          <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 16px;\"><strong style=\"color: #FFFFFF;\">Sudhakar Ramakrishna<\u002Fstrong> became President and CEO in January 2021, following the SUNBURST cyberattack disclosure, and was brought in specifically for crisis management. Independent directors and a new Cybersecurity Committee were added the same year to strengthen oversight.<\u002Fp>\n          <p style=\"font-size: 16px; line-height: 1.7; margin: 0;\">This is <strong style=\"color: #FFFFFF;\">PE-controlled public company governance<\u002Fstrong>: board seats reserved for sponsor nominees, limited independence from major investors, and a board whose primary obligation ran to Silver Lake rather than the dispersed public float. Power sat squarely with the inside shareholder — the public float was a minority economic interest with little governance voice.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n            <div style=\"font-size: 13px; color: #8B92A3; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;\">SUNBURST (Dec 2020)<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.6;\">A nation-state supply-chain attack compromised ~18,000 customers, including US federal agencies. It exposed governance gaps and preceded CEO Kevin Thompson's resignation days after disclosure.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n            <div style=\"font-size: 13px; color: #8B92A3; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;\">2025 outcome<\u002Fdiv>\n            <div style=\"font-size: 15px; line-height: 1.6;\">Silver Lake-driven sale to Turn/River Capital at $18.50/share, closed April 2025.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- STEP 3 -->\n    <section id=\"objectives\" style=\"padding: 56px 0; border-bottom: 1px solid rgba(255,255,255,0.08);\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #35A8B1;\">STEP 03<\u002Fdiv>\n      <h2 style=\"font-size: 30px; font-weight: 600; color: #FFFFFF; margin: 8px 0 20px; letter-spacing: -0.01em;\">Stated objectives<\u002Fh2>\n      <p style=\"font-size: 16px; line-height: 1.7; max-width: 800px; margin: 0 0 24px;\">SolarWinds' 2024 investor narrative centered on four goals, all pointing toward one underlying objective: maximizing sale value under a controlling PE shareholder.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;\">\n        <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n          <div style=\"font-size: 15px; font-weight: 600; color: #FFFFFF; margin-bottom: 8px;\">Subscription growth<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.6; color: #E1E5EA;\">Shift from perpetual licenses to recurring SaaS revenue; ARR growth was the headline 2024 KPI.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n          <div style=\"font-size: 15px; font-weight: 600; color: #FFFFFF; margin-bottom: 8px;\">Margin expansion<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.6; color: #E1E5EA;\">Adjusted EBITDA of $384.7M (48% margin) in 2024, with a target to sustain 48–50%.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n          <div style=\"font-size: 15px; font-weight: 600; color: #FFFFFF; margin-bottom: 8px;\">Observability + AIOps<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.6; color: #E1E5EA;\">Repositioning from monitoring tools to a unified platform; Squadcast acquired March 2025.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n          <div style=\"font-size: 15px; font-weight: 600; color: #FFFFFF; margin-bottom: 8px;\">Revenue growth<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.6; color: #E1E5EA;\">~5% YoY total revenue growth in 2024, with modest acceleration guided as subscription mix rises.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 16px; line-height: 1.7; max-width: 800px; margin: 24px 0 0;\">With Silver Lake as controlling shareholder and a sale pending, the ultimate objective was firm value maximization — reflected in the Turn/River deal price of approximately 5.5× 2024 revenue.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- STEP 4 -->\n    <section id=\"shares\" style=\"padding: 56px 0; border-bottom: 1px solid rgba(255,255,255,0.08);\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #35A8B1;\">STEP 04<\u002Fdiv>\n      <h2 style=\"font-size: 30px; font-weight: 600; color: #FFFFFF; margin: 8px 0 20px; letter-spacing: -0.01em;\">Share classes and the marginal investor<\u002Fh2>\n      <p style=\"font-size: 16px; line-height: 1.7; max-width: 800px; margin: 0 0 24px;\">SolarWinds had a single class of common shares, one vote each — no dual-class structure. Approximately 237 million diluted shares were outstanding at acquisition (~$4.4B ÷ $18.50).<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: 1.4fr 1fr; gap: 32px; align-items: start;\">\n        <div>\n          <div style=\"font-size: 13px; color: #8B92A3; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px;\">Shareholder base (pre-acquisition)<\u002Fdiv>\n          <div style=\"display: flex; height: 40px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08);\">\n            <div style=\"width: 75%; background: #35A8B1; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 12px; color: #1A1E2B;\">Silver Lake ~75%<\u002Fdiv>\n            <div style=\"width: 7%; background: #89ECEF; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 11px; color: #1A1E2B;\"><\u002Fdiv>\n            <div style=\"width: 18%; background: #8B92A3; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 11px; color: #1A1E2B;\">Public ~18%<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 20px; margin-top: 10px; font-size: 12px; color: #8B92A3; flex-wrap: wrap;\">\n            <div><span style=\"display:inline-block; width:8px; height:8px; background:#35A8B1; border-radius:2px; margin-right:6px;\"><\u002Fspan>Silver Lake Partners — ~75%, dominant sponsor<\u002Fdiv>\n            <div><span style=\"display:inline-block; width:8px; height:8px; background:#89ECEF; border-radius:2px; margin-right:6px;\"><\u002Fspan>Index funds — ~5–8% combined<\u002Fdiv>\n            <div><span style=\"display:inline-block; width:8px; height:8px; background:#8B92A3; border-radius:2px; margin-right:6px;\"><\u002Fspan>Public float / institutions — ~15–20%<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 13px; color: #8B92A3; margin-top: 8px;\">Thoma Bravo's stake was sold down progressively over 2018–2023 and is not separately sized above.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n          <div style=\"font-size: 15px; font-weight: 600; color: #FFFFFF; margin-bottom: 8px;\">Marginal investor<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.6; margin-bottom: 12px;\">A diversified institutional investor — index or active fund — not Silver Lake, which wasn't actively trading. Price discovery ran through the smaller public float.<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.6;\"><strong style=\"color: #FFFFFF;\">Diversification: yes.<\u002Fstrong> This supports using market (levered) beta rather than total beta for the cost of equity.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- STEP 5 -->\n    <section id=\"currency\" style=\"padding: 56px 0; border-bottom: 1px solid rgba(255,255,255,0.08);\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #35A8B1;\">STEP 05<\u002Fdiv>\n      <h2 style=\"font-size: 30px; font-weight: 600; color: #FFFFFF; margin: 8px 0 20px; letter-spacing: -0.01em;\">Currency and risk-free rate<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: 1.4fr 1fr; gap: 32px;\">\n        <div>\n          <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 16px;\">SolarWinds reports in <strong style=\"color: #FFFFFF;\">US dollars<\u002Fstrong>, is domiciled in Austin, Texas, and generates about 69% of revenue in North America (mostly USD, some CAD). International revenue (~31%, EMEA + APAC) is billed largely in USD even where earned in EUR, GBP, or AUD, which limits translation risk.<\u002Fp>\n          <p style=\"font-size: 16px; line-height: 1.7; margin: 0;\">USD is the natural analysis currency: it matches how the company reports, is domiciled, and is benchmarked by investors.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n          <div style=\"font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; color: #FFFFFF;\">4.68%<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #8B92A3; margin-top: 4px; margin-bottom: 12px;\">Risk-free rate — US 10-year Treasury, Aug 27, 2026<\u002Fdiv>\n          <div style=\"font-size: 13px; line-height: 1.6; color: #8B92A3;\">Above the 12-month average of 4.29%, reflecting a mild yield backup over summer 2026.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- STEP 6 -->\n    <section id=\"erp\" style=\"padding: 56px 0; border-bottom: 1px solid rgba(255,255,255,0.08);\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #35A8B1;\">STEP 06<\u002Fdiv>\n      <h2 style=\"font-size: 30px; font-weight: 600; color: #FFFFFF; margin: 8px 0 20px; letter-spacing: -0.01em;\">Equity risk premium (mature market)<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: 1fr 1.4fr; gap: 32px; align-items: start;\">\n        <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n          <div style=\"font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; color: #FFFFFF;\">4.42%<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #8B92A3; margin-top: 4px;\">Damodaran implied US ERP, S&amp;P 500 at 7,499 (July 1, 2026)<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 12px;\">The <strong style=\"color: #FFFFFF;\">implied<\u002Fstrong> method backs out the ERP that reconciles current equity prices with expected future cash flows — forward-looking, unlike a historical average. It's consistent with the long-run historical premium of roughly 4.5–5.5%.<\u002Fp>\n          <p style=\"font-size: 14px; line-height: 1.6; color: #8B92A3; margin: 0;\">Source: Damodaran, <em>Equity Risk Premiums — The 2026 Edition<\u002Fem> (SSRN). Damodaran's methodology now folds in a small sovereign spread following the May 2025 Moody's downgrade of the US from Aaa to Aa1.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- STEP 7 -->\n    <section id=\"country-risk\" style=\"padding: 56px 0; border-bottom: 1px solid rgba(255,255,255,0.08);\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #35A8B1;\">STEP 07<\u002Fdiv>\n      <h2 style=\"font-size: 30px; font-weight: 600; color: #FFFFFF; margin: 8px 0 20px; letter-spacing: -0.01em;\">Country risk and weighted ERP<\u002Fh2>\n      <p style=\"font-size: 16px; line-height: 1.7; max-width: 800px; margin: 0 0 20px;\">As a pure software company with no significant manufacturing footprint, SolarWinds' revenue mix is the best proxy for where its risk is borne.<\u002Fp>\n      <table style=\"width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 20px;\">\n        <thead>\n          <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.16);\">\n            <th style=\"text-align: left; padding: 10px 12px; color: #8B92A3; font-weight: 500;\">Region<\u002Fth>\n            <th style=\"text-align: right; padding: 10px 12px; color: #8B92A3; font-weight: 500;\">% of revenue<\u002Fth>\n            <th style=\"text-align: right; padding: 10px 12px; color: #8B92A3; font-weight: 500;\">Country ERP<\u002Fth>\n            <th style=\"text-align: right; padding: 10px 12px; color: #8B92A3; font-weight: 500;\">Country risk premium<\u002Fth>\n          <\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.08);\">\n            <td style=\"padding: 10px 12px;\">United States / North America<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace;\">69%<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace;\">4.45%<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace; color: #8B92A3;\">~0.03%<\u002Ftd>\n          <\u002Ftr>\n          <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.08);\">\n            <td style=\"padding: 10px 12px;\">EMEA (primarily Western Europe)<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace;\">20%<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace;\">4.60%<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace; color: #8B92A3;\">~0.18%<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td style=\"padding: 10px 12px;\">APAC + LatAm<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace;\">11%<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace;\">5.20%<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace; color: #8B92A3;\">~0.78%<\u002Ftd>\n          <\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <div style=\"display: flex; align-items: center; gap: 16px; padding: 16px 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; max-width: 480px;\">\n        <div style=\"font-family: 'Space Mono', monospace; font-size: 24px; font-weight: 700; color: #FFFFFF;\">4.56%<\u002Fdiv>\n        <div style=\"font-size: 14px; color: #8B92A3;\">Revenue-weighted ERP incorporating country risk<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- STEP 8 -->\n    <section id=\"reg-beta\" style=\"padding: 56px 0; border-bottom: 1px solid rgba(255,255,255,0.08);\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #35A8B1;\">STEP 08<\u002Fdiv>\n      <h2 style=\"font-size: 30px; font-weight: 600; color: #FFFFFF; margin: 8px 0 20px; letter-spacing: -0.01em;\">Regression beta<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: 1fr 1.4fr; gap: 32px; align-items: start;\">\n        <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n          <div style=\"font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; color: #FFFFFF;\">0.88<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #8B92A3; margin-top: 4px;\">vs. S&amp;P 500, NYSE:SWI trading history (2018–2025)<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 12px;\">R-squared wasn't directly retrieved; the Software (System &amp; Application) sector averages ~0.337 market correlation (Damodaran), implying R² near 11–12% for a typical software firm — SolarWinds, with its PE-concentrated float, likely sits lower, around 10–15%.<\u002Fp>\n          <p style=\"font-size: 16px; line-height: 1.7; margin: 0; color: #E1E5EA;\"><strong style=\"color: #FFFFFF;\">Low-to-moderate reliability.<\u002Fstrong> The trading history is short and structurally broken (private 2016–2018, delisted April 2025) and includes the SUNBURST crisis, a period of company-specific price moves unrelated to the market. Silver Lake's ~75% stake thinned the float behind the regression. A true enterprise software company with real operating and financial leverage would be expected to show beta above 1.0 — 0.88 likely reflects Silver Lake's non-trading behavior and the defensive pull of SolarWinds' government customer base, not its true risk. The bottom-up approach (Step 10) is preferred.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- STEP 9 -->\n    <section id=\"beta-fund\" style=\"padding: 56px 0; border-bottom: 1px solid rgba(255,255,255,0.08);\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #35A8B1;\">STEP 09<\u002Fdiv>\n      <h2 style=\"font-size: 30px; font-weight: 600; color: #FFFFFF; margin: 8px 0 20px; letter-spacing: -0.01em;\">Beta fundamentals<\u002Fh2>\n      <p style=\"font-size: 16px; line-height: 1.7; max-width: 800px; margin: 0 0 20px;\">SolarWinds sells enterprise IT monitoring, observability, and service management software, increasingly as SaaS. Sticky, mission-critical products and a non-cyclical government customer base pull beta down; mild cyclicality in enterprise IT spending and disruption risk from cloud-native competitors (Datadog, New Relic, Dynatrace) pull it up. Net expectation from the product profile alone: <strong style=\"color: #FFFFFF;\">0.9–1.2<\u002Fstrong>.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px;\">\n        <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n          <div style=\"font-size: 15px; font-weight: 600; color: #FFFFFF; margin-bottom: 8px;\">Operating leverage — high<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.6;\">Gross margin ~89.5% ($713.6M gross profit on $796.9M revenue); R&amp;D and G&amp;A are largely fixed, so a 1% revenue decline flows through almost entirely to operating income. This amplifies cyclicality beyond what product stickiness alone implies.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n          <div style=\"font-size: 15px; font-weight: 600; color: #FFFFFF; margin-bottom: 8px;\">Financial leverage — substantial<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.6;\">$1.235B first-lien term loan against ~$4.4B equity value (D/E 0.281). At a 25% tax rate, the Hamada multiplier is 1.211 — leverage alone adds ~21% to the unlevered beta.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- STEP 10 -->\n    <section id=\"unlevered\" style=\"padding: 56px 0; border-bottom: 1px solid rgba(255,255,255,0.08);\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #35A8B1;\">STEP 10<\u002Fdiv>\n      <h2 style=\"font-size: 30px; font-weight: 600; color: #FFFFFF; margin: 8px 0 20px; letter-spacing: -0.01em;\">Bottom-up unlevered beta<\u002Fh2>\n      <p style=\"font-size: 16px; line-height: 1.7; max-width: 800px; margin: 0 0 20px;\">SolarWinds is a single-segment enterprise software company (IT Operations Management, increasingly observability) with no material segment reporting. It maps cleanly to Damodaran's <strong style=\"color: #FFFFFF;\">Software (System &amp; Application)<\u002Fstrong> industry group — enterprise software selling monitoring, ERP, CRM, and application-management tools to businesses, not gaming or consumer software.<\u002Fp>\n      <div style=\"display: flex; gap: 16px; flex-wrap: wrap;\">\n        <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; flex: 1; min-width: 200px;\">\n          <div style=\"font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; color: #FFFFFF;\">1.27<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #8B92A3; margin-top: 4px;\">Unlevered beta — industry average, 351 firms (Damodaran, Jan 2024)<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; flex: 1; min-width: 200px;\">\n          <div style=\"font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; color: #FFFFFF;\">0.337<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #8B92A3; margin-top: 4px;\">Sector average correlation with market<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 14px; line-height: 1.6; color: #8B92A3; max-width: 800px; margin: 16px 0 0;\">No segment weighting is needed given the single business line. A downward adjustment could be argued for SolarWinds' government customer base, but using the industry average avoids cherry-picking.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- STEP 11 -->\n    <section id=\"levered\" style=\"padding: 56px 0; border-bottom: 1px solid rgba(255,255,255,0.08);\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #35A8B1;\">STEP 11<\u002Fdiv>\n      <h2 style=\"font-size: 30px; font-weight: 600; color: #FFFFFF; margin: 8px 0 20px; letter-spacing: -0.01em;\">Levered beta and total beta<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-items: start; margin-bottom: 28px;\">\n        <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n          <div style=\"font-size: 13px; color: #8B92A3; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;\">Hamada equation<\u002Fdiv>\n          <div style=\"font-family: 'Space Mono', monospace; font-size: 14px; line-height: 1.8; color: #E1E5EA;\">Levered β = Unlevered β × [1 + (1−t) × D/E]<br>= 1.2725 × [1 + 0.75 × 0.2807]<br>= 1.2725 × 1.2105 = <strong style=\"color: #89ECEF;\">1.54<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n          <div style=\"font-size: 13px; color: #8B92A3; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;\">Total beta<\u002Fdiv>\n          <div style=\"font-family: 'Space Mono', monospace; font-size: 14px; line-height: 1.8; color: #E1E5EA;\">Total β = Levered β ÷ Correlation<br>= 1.54 ÷ 0.337 = <strong style=\"color: #89ECEF;\">4.57<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size: 13px; color: #8B92A3; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px;\">Beta comparison<\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px;\">\n        <div style=\"display: grid; grid-template-columns: 180px 1fr 70px; align-items: center; gap: 12px;\">\n          <div style=\"font-size: 14px;\">Regression (historical)<\u002Fdiv>\n          <div style=\"background: rgba(255,255,255,0.06); border-radius: 6px; height: 22px; overflow: hidden;\"><div style=\"width: 19.3%; height: 100%; background: #8B92A3; border-radius: 6px;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family: 'Space Mono', monospace; font-size: 14px; text-align: right;\">0.88<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 180px 1fr 70px; align-items: center; gap: 12px;\">\n          <div style=\"font-size: 14px;\">Bottom-up levered<\u002Fdiv>\n          <div style=\"background: rgba(255,255,255,0.06); border-radius: 6px; height: 22px; overflow: hidden;\"><div style=\"width: 33.9%; height: 100%; background: #35A8B1; border-radius: 6px;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family: 'Space Mono', monospace; font-size: 14px; text-align: right;\">1.55<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 180px 1fr 70px; align-items: center; gap: 12px;\">\n          <div style=\"font-size: 14px;\">Total (PE / undiversified)<\u002Fdiv>\n          <div style=\"background: rgba(255,255,255,0.06); border-radius: 6px; height: 22px; overflow: hidden;\"><div style=\"width: 100%; height: 100%; background: #89ECEF; border-radius: 6px;\"><\u002Fdiv><\u002Fdiv>\n          <div style=\"font-family: 'Space Mono', monospace; font-size: 14px; text-align: right;\">4.60<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 16px;\">The regression beta (0.88) sits well below the bottom-up levered beta (1.55), consistent with the reliability concerns from Step 8 — thin float, PE anchor, structural breaks in the trading history.<\u002Fp>\n      <table style=\"width: 100%; border-collapse: collapse; font-size: 14px;\">\n        <thead>\n          <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.16);\">\n            <th style=\"text-align: left; padding: 10px 12px; color: #8B92A3; font-weight: 500;\">Investor type<\u002Fth>\n            <th style=\"text-align: right; padding: 10px 12px; color: #8B92A3; font-weight: 500;\">Beta<\u002Fth>\n            <th style=\"text-align: right; padding: 10px 12px; color: #8B92A3; font-weight: 500;\">Cost of equity<\u002Fth>\n          <\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.08);\">\n            <td style=\"padding: 10px 12px;\">Diversified institutional (public markets)<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace;\">1.54<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace;\">~11.9%<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td style=\"padding: 10px 12px;\">Undiversified PE owner (Turn/River Capital)<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace;\">4.57<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace;\">~25.5%<\u002Ftd>\n          <\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <p style=\"font-size: 14px; line-height: 1.6; color: #8B92A3; margin: 12px 0 0;\">Total beta cost of equity: 4.68% + 4.57 × 4.56% = 25.5% — this is why PE funds require high IRRs (typically 20–25%+) to compensate for concentrated risk exposure.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- STEP 12 -->\n    <section id=\"cod\" style=\"padding: 56px 0; border-bottom: 1px solid rgba(255,255,255,0.08);\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #35A8B1;\">STEP 12<\u002Fdiv>\n      <h2 style=\"font-size: 30px; font-weight: 600; color: #FFFFFF; margin: 8px 0 20px; letter-spacing: -0.01em;\">Cost of debt<\u002Fh2>\n      <p style=\"font-size: 16px; line-height: 1.7; max-width: 820px; margin: 0 0 20px;\">SolarWinds carried a <strong style=\"color: #FFFFFF;\">B+ rating from S&amp;P<\u002Fstrong> as a public company. At Turn/River's acquisition close, S&amp;P assigned a B rating (stable) to the new private entity, Starlight Parent LLC. Using the pre-acquisition B+ spread of 2.74%: pre-tax cost of debt = 4.68% + 2.74% = <strong style=\"color: #FFFFFF;\">7.42%<\u002Fstrong>. This is used here since the valuation is based on FY2024, when SolarWinds was still B+-rated.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;\">\n        <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n          <div style=\"font-size: 15px; font-weight: 600; color: #FFFFFF; margin-bottom: 8px;\">Synthetic rating: B3/B-<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.6;\">EBIT of $208.4M against ~$107.2M interest expense gives 1.95× coverage — mapping to B3/B- (6.04% spread, 10.72% pre-tax cost of debt). This overstates true risk: it's EBIT-based and misses the amortization buffer from the 2016 LBO.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 20px; background: #2D3447; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px;\">\n          <div style=\"font-size: 15px; font-weight: 600; color: #FFFFFF; margin-bottom: 8px;\">Why the actual B+ rating is used<\u002Fdiv>\n          <div style=\"font-size: 14px; line-height: 1.6;\">EBITDA-based coverage (384.7 / 107.2 = 3.59×) maps closer to Ba2/BB. The debt is first-lien secured, and recurring SaaS revenue earns credit for predictability. The term loan priced at SOFR + 3.25% (~7.25% at SOFR ~4.0%) — close to the 7.42% B+ estimate.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 16px; line-height: 1.7; max-width: 820px; margin: 0;\">Capitalizing an estimated ~$82M of operating leases brings total adjusted debt to <strong style=\"color: #FFFFFF;\">$1,317M<\u002Fstrong> (adjusted D/E of 0.299). The marginal tax rate used is the statutory <strong style=\"color: #FFFFFF;\">25%<\u002Fstrong> (21% federal + ~4% blended state) — not the FY2024 effective rate, which included a one-time tax benefit from reversing uncertain tax positions.<\u002Fp>\n    <\u002Fsection>\n\n    <!-- SUMMARY -->\n    <section id=\"summary\" style=\"padding: 56px 0 80px;\">\n      <div style=\"font-family: 'Space Mono', monospace; font-size: 13px; color: #35A8B1;\">SUMMARY<\u002Fdiv>\n      <h2 style=\"font-size: 34px; font-weight: 600; color: #FFFFFF; margin: 8px 0 24px; letter-spacing: -0.01em;\">Cost of capital<\u002Fh2>\n\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 32px; margin-bottom: 40px;\">\n        <div>\n          <div style=\"font-size: 13px; color: #8B92A3; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px;\">Capital structure (lease-adjusted)<\u002Fdiv>\n          <div style=\"display: flex; height: 40px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 10px;\">\n            <div style=\"width: 76.9%; background: #35A8B1; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 12px; color: #1A1E2B;\">Equity 76.9%<\u002Fdiv>\n            <div style=\"width: 23.1%; background: #8B92A3; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 12px; color: #1A1E2B;\">Debt 23.1%<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 13px; color: #8B92A3;\">Equity $4,400M · Debt (incl. leases) $1,317M · Total $5,717M<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-size: 13px; color: #8B92A3; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px;\">WACC build-up<\u002Fdiv>\n          <div style=\"display: flex; height: 40px; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 10px;\">\n            <div style=\"width: 87.5%; background: #89ECEF; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 12px; color: #1A1E2B;\">Equity 9.03pp<\u002Fdiv>\n            <div style=\"width: 12.5%; background: #35A8B1; display: flex; align-items: center; justify-content: center; font-family: 'Space Mono', monospace; font-size: 11px; color: #1A1E2B;\">Debt 1.29pp<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 13px; color: #8B92A3;\">(76.9% × 11.75%) + (23.1% × 7.42% × 0.75) = <strong style=\"color: #FFFFFF;\">10.33%<\u002Fstrong><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 40px;\">\n        <table style=\"grid-column: span 3; width: 100%; border-collapse: collapse; font-size: 14px;\">\n          <thead>\n            <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.16);\">\n              <th style=\"text-align: left; padding: 10px 12px; color: #8B92A3; font-weight: 500;\">Input<\u002Fth>\n              <th style=\"text-align: right; padding: 10px 12px; color: #8B92A3; font-weight: 500;\">Value<\u002Fth>\n              <th style=\"text-align: left; padding: 10px 12px; color: #8B92A3; font-weight: 500;\">Source / notes<\u002Fth>\n            <\u002Ftr>\n          <\u002Fthead>\n          <tbody>\n            <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.08);\"><td style=\"padding: 8px 12px;\">Risk-free rate<\u002Ftd><td style=\"text-align: right; padding: 8px 12px; font-family: 'Space Mono', monospace;\">4.68%<\u002Ftd><td style=\"padding: 8px 12px; color: #8B92A3;\">US 10-year Treasury, Aug 27, 2026<\u002Ftd><\u002Ftr>\n            <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.08);\"><td style=\"padding: 8px 12px;\">Country-weighted ERP<\u002Ftd><td style=\"text-align: right; padding: 8px 12px; font-family: 'Space Mono', monospace;\">4.56%<\u002Ftd><td style=\"padding: 8px 12px; color: #8B92A3;\">Revenue-weighted: 69% US, 20% EMEA, 11% APAC/LatAm<\u002Ftd><\u002Ftr>\n            <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.08);\"><td style=\"padding: 8px 12px;\">Levered beta (Hamada)<\u002Ftd><td style=\"text-align: right; padding: 8px 12px; font-family: 'Space Mono', monospace; color: #FFFFFF; font-weight: 700;\">1.55<\u002Ftd><td style=\"padding: 8px 12px; color: #8B92A3;\">1.2725 × [1 + 0.75 × 0.299]<\u002Ftd><\u002Ftr>\n            <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.08);\"><td style=\"padding: 8px 12px;\">Cost of equity<\u002Ftd><td style=\"text-align: right; padding: 8px 12px; font-family: 'Space Mono', monospace; color: #FFFFFF; font-weight: 700;\">11.75%<\u002Ftd><td style=\"padding: 8px 12px; color: #8B92A3;\">4.68% + 1.55 × 4.56%<\u002Ftd><\u002Ftr>\n            <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.08);\"><td style=\"padding: 8px 12px;\">After-tax cost of debt<\u002Ftd><td style=\"text-align: right; padding: 8px 12px; font-family: 'Space Mono', monospace; color: #FFFFFF; font-weight: 700;\">5.57%<\u002Ftd><td style=\"padding: 8px 12px; color: #8B92A3;\">7.42% × (1 − 0.25)<\u002Ftd><\u002Ftr>\n            <tr><td style=\"padding: 8px 12px; font-weight: 600; color: #FFFFFF;\">WACC<\u002Ftd><td style=\"text-align: right; padding: 8px 12px; font-family: 'Space Mono', monospace; font-weight: 700; font-size: 16px; background: linear-gradient(135deg, #89ECEF, #35A8B1); -webkit-background-clip: text; background-clip: text; color: transparent;\">10.33%<\u002Ftd><td style=\"padding: 8px 12px; color: #8B92A3;\">0.769 × 11.75% + 0.231 × 5.57%<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n\n      <div style=\"font-size: 13px; color: #8B92A3; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px;\">Sensitivity: which beta to trust<\u002Fdiv>\n      <table style=\"width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 24px;\">\n        <thead>\n          <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.16);\">\n            <th style=\"text-align: left; padding: 10px 12px; color: #8B92A3; font-weight: 500;\">Beta approach<\u002Fth>\n            <th style=\"text-align: right; padding: 10px 12px; color: #8B92A3; font-weight: 500;\">Beta<\u002Fth>\n            <th style=\"text-align: right; padding: 10px 12px; color: #8B92A3; font-weight: 500;\">Cost of equity<\u002Fth>\n            <th style=\"text-align: right; padding: 10px 12px; color: #8B92A3; font-weight: 500;\">WACC<\u002Fth>\n          <\u002Ftr>\n        <\u002Fthead>\n        <tbody>\n          <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.08);\">\n            <td style=\"padding: 10px 12px;\">Regression (historical)<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace;\">0.88<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace;\">8.70%<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace;\">7.97%<\u002Ftd>\n          <\u002Ftr>\n          <tr style=\"border-bottom: 1px solid rgba(255,255,255,0.08); background: rgba(53,168,177,0.08);\">\n            <td style=\"padding: 10px 12px; font-weight: 600; color: #FFFFFF;\">Bottom-up (preferred)<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace; font-weight: 700;\">1.55<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace; font-weight: 700;\">11.75%<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace; font-weight: 700; color: #89ECEF;\">10.33%<\u002Ftd>\n          <\u002Ftr>\n          <tr>\n            <td style=\"padding: 10px 12px;\">Total beta (PE perspective)<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace;\">4.60<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace;\">25.64%<\u002Ftd>\n            <td style=\"text-align: right; padding: 10px 12px; font-family: 'Space Mono', monospace; color: #8B92A3;\">—<\u002Ftd>\n          <\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <p style=\"font-size: 16px; line-height: 1.7; max-width: 820px; margin: 0 0 8px;\">The bottom-up WACC of <strong style=\"color: #FFFFFF;\">~10.3%<\u002Fstrong> is the preferred estimate — the regression beta understates risk given the structural issues in Step 8. The total-beta view (25%+ cost of equity) is the more relevant lens for Turn/River Capital as an undiversified PE owner.<\u002Fp>\n      <div style=\"font-size: 13px; color: #8B92A3; margin-top: 32px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,0.08);\">Report generated August 27, 2026 · Data sources: SolarWinds FY2024 10-K (SEC EDGAR), Damodaran ERP/Beta datasets (Jan–Jul 2026), US Treasury daily yield curve.<\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<\u002Fbody><\u002Fhtml>"
