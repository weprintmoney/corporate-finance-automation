name: Fetch Company Financials

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Stock ticker symbol (e.g. AAPL, MSFT, GOOGL)'
        required: true
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fetch financials from Financial Modeling Prep
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python3 scripts/fetch-company-data.py "${{ inputs.ticker }}"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 03-corporate-finance/03-3-supplemental-data/companies/
          git diff --staged --quiet && echo "No changes." || (
            git commit -m "data: fetch ${{ inputs.ticker }} financials $(date -u +%Y-%m-%d)" &&
            git push
          )
